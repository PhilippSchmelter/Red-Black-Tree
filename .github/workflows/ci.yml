name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: gcc,   cc: gcc,    cxx: g++,     build_type: Debug }
          - { os: ubuntu-latest,  compiler: gcc,   cc: gcc,    cxx: g++,     build_type: Release }
          - { os: ubuntu-latest,  compiler: clang, cc: clang,  cxx: clang++, build_type: Debug }
          - { os: macos-latest,   compiler: clang, cc: clang,  cxx: clang++, build_type: Release }
          - { os: windows-latest, compiler: msvc,  cc: cl,     cxx: cl,      build_type: Debug }
          - { os: windows-latest, compiler: msvc,  cc: cl,     cxx: cl,      build_type: Release }

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRBTREE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config ${{ matrix.build_type }}

  sanitizers:
    name: ubuntu-latest / clang / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
          CXXFLAGS: -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -O1 -g
          LDFLAGS:  -fsanitize=${{ matrix.sanitizer }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure
